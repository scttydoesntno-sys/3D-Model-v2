(()=>{'use strict';const $=id=>document.getElementById(id);let mode='3d',yaw=-27,pitch=-8,zoom=1,frame=0,drag=null,timer=null,active=null;const photos=data.photos||{},frames=Array.isArray(data.frames)?data.frames:[],markers=Array.isArray(data.markers)?data.markers:[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));$('product').textContent=data.product||'Product inspection';document.title=(data.product||'Product')+' | Great Gadget Store';document.querySelectorAll('.face[data-face]').forEach(el=>{let side=el.dataset.face;if(photos[side]){const im=document.createElement('img');im.src=photos[side];im.alt=side+' product photo';el.append(im)}else if(side==='front'||side==='back'){const p=document.createElement('div');p.className='placeholder';p.textContent=side.toUpperCase()+' · Photo unavailable';el.append(p)}});

$('stage').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.marker'))return;drag={x:e.clientX,y:e.clientY,yaw,pitch,frame};$('stage').setPointerCapture(e.pointerId)});$('stage').addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(mode==='3d'){yaw=drag.yaw+dx*.65;pitch=clamp(drag.pitch-dy*.35,-65,65)}else if(frames.length)frame=((drag.frame-Math.round(dx/15))%frames.length+frames.length)%frames.length;draw()});$('stage').addEventListener('pointerup',()=>drag=null);$('stage').addEventListener('pointercancel',()=>drag=null);$('stage').addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom+(e.deltaY<0?.08:-.08),.55,2);$('zoom').value=Math.round(zoom*100);draw()},{passive:false});window.addEventListener('resize',drawMarkers);draw();})();
