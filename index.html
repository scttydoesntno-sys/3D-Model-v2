<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gadget Grab | Great Gadget Store</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173047}*{box-sizing:border-box}body{margin:0;background:#eaf8f7}.wrap{max-width:1100px;margin:auto;min-height:360px;background:linear-gradient(115deg,#dff8f2,#e9f0ff 60%,#fff3d5);border:2px solid #b9e6e1;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:290px minmax(0,1fr)}aside{padding:24px;display:flex;flex-direction:column;justify-content:center;gap:11px}h1{margin:0;font-size:clamp(27px,3vw,39px);letter-spacing:-1px;line-height:1}h1 span{color:#008d83}p{margin:0;color:#52677a;font-size:14px;line-height:1.5}.stats{display:flex;gap:9px;flex-wrap:wrap}.pill{background:#ffffffc9;border:1px solid #b8dfdd;border-radius:12px;padding:8px 11px;font-weight:800;font-size:13px}button{background:#008d83;color:white;border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;font-size:14px}button:hover{background:#006c65}button:focus-visible{outline:3px solid #ffbe46;outline-offset:2px}.note{font-size:12px}.arena{position:relative;min-height:360px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#ffffff90,transparent 60%)}canvas{display:block;width:100%;height:360px;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#effcf7bd;backdrop-filter:blur(3px);padding:20px;text-align:center}.panel{background:#fff;border:1px solid #b7e2dd;border-radius:18px;box-shadow:0 12px 36px #163b4a20;padding:22px;max-width:300px}.panel h2{margin:0 0 8px;font-size:24px}.panel p{margin-bottom:15px}.hidden{display:none}@media(max-width:650px){.wrap{grid-template-columns:1fr}aside{padding:16px;gap:8px}h1{font-size:27px}.arena{min-height:290px}canvas{height:290px}.note{display:none}}
</style></head><body><main class="wrap"><aside><div style="font-size:12px;font-weight:900;letter-spacing:1.4px;color:#008d83">GREAT GADGET STORE PRESENTS</div><h1>Gadget <span>Grab!</span> 🎮</h1><p>Catch the gadgets. Dodge the broken ones. How high can you score?</p><div class="stats"><div class="pill">⭐ Score: <span id="score">0</span></div><div class="pill">❤️ Lives: <span id="lives">3</span></div><div class="pill">🏆 Best: <span id="best">0</span></div></div><button id="start">Start playing</button><p class="note">Move with ← →, A / D, mouse or touch. Catch 📱 🎧 🎮 💻. Avoid 💥.</p></aside><section class="arena" aria-label="Gadget Grab game"><canvas id="game" aria-label="Catch falling gadgets by moving the basket"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="message">Ready to grab? 🛍️</h2><p id="detail">Catch gadgets to score points. Broken items cost a life!</p><button id="play">Let's play!</button></div></div></section></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),detail=document.getElementById('detail'),start=document.getElementById('start');let w=600,h=360,dpr=1,active=false,score=0,lives=3,best=0,player=.5,items=[],particles=[],spawn=0,last=0,keys=new Set(),time=0;try{best=Number(localStorage.getItem('ggs-gadget-grab-best')||0)||0}catch(e){}bestEl.textContent=best;const symbols=['📱','🎧','🎮','💻','⌚'];function resize(){const r=canvas.getBoundingClientRect();w=Math.max(200,r.width);h=Math.max(220,r.height);dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();function begin(){score=0;lives=3;player=.5;items=[];particles=[];spawn=0;time=0;active=true;overlay.classList.add('hidden');scoreEl.textContent=score;livesEl.textContent=lives;start.textContent='Restart game';last=performance.now()}function end(){active=false;message.textContent='Game over! 🎉';detail.textContent=`You scored ${score} points. ${score>=best?'New personal best!':'Give it another go!'}`;document.getElementById('play').textContent='Play again';overlay.classList.remove('hidden')}function burst(x,y,color){for(let i=0;i<9;i++)particles.push({x,y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,life:.55,color})}function draw(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;ctx.clearRect(0,0,w,h);ctx.fillStyle='#b1e4db44';for(let i=0;i<15;i++){const x=(i*127+35)%w,y=(i*79+25)%h;ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#b6e3db';ctx.fillRect(0,h-27,w,27);ctx.fillStyle='#ffffff88';for(let x=0;x<w;x+=38)ctx.fillRect(x,h-20,20,3);if(active){time+=dt;if(keys.has('ArrowLeft')||keys.has('a'))player-=dt*1.05;if(keys.has('ArrowRight')||keys.has('d'))player+=dt*1.05;player=Math.max(.07,Math.min(.93,player));spawn-=dt;if(spawn<=0){const bad=Math.random()<Math.min(.29,.16+time/260);items.push({x:25+Math.random()*(w-50),y:-28,bad,sym:bad?'💥':symbols[Math.floor(Math.random()*symbols.length)],speed:100+Math.min(160,time*2)+Math.random()*50,angle:Math.random()*2-1});spawn=Math.max(.36,.85-time*.006)}for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.speed*dt;if(it.y>h-67&&it.y<h-35&&Math.abs(it.x-player*w)<43){if(it.bad){lives--;livesEl.textContent=lives;burst(it.x,it.y,'#ef6377');if(lives<=0)end()}else{score+=10;scoreEl.textContent=score;burst(it.x,it.y,'#10a99c');if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('ggs-gadget-grab-best',best)}catch(e){}}}items.splice(i,1)}else if(it.y>h+35){items.splice(i,1)}}}for(const it of items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(Math.sin(time*2+it.angle)*.13);ctx.font='34px system-ui,Apple Color Emoji,Segoe UI Emoji';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.sym,0,0);ctx.restore()}const bx=player*w;ctx.fillStyle='#007f77';ctx.beginPath();ctx.roundRect(bx-43,h-64,86,46,11);ctx.fill();ctx.strokeStyle='#c8fff0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(bx,h-61,27,Math.PI,0);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('GGS',bx,h-35);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/.55);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}requestAnimationFrame(draw)}document.getElementById('play').addEventListener('click',begin);start.addEventListener('click',begin);window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){keys.add(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase());if(active)e.preventDefault()}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase()));function move(e){const r=canvas.getBoundingClientRect();player=Math.max(.07,Math.min(.93,(e.clientX-r.left)/r.width))}canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)move(e)});canvas.addEventListener('pointerdown',e=>{move(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')move(e)});requestAnimationFrame(draw)})();
</script></body></html>
